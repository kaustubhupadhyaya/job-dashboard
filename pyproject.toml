[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-dashboard"
version = "0.1.0"
description = "Read-only local dashboard for job-application bots"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
tracker = ["openpyxl>=3.1"]

[project.scripts]
job-dashboard = "dashboard.server:main"

[tool.setuptools]
packages = ["dashboard", "portal_kit"]
